<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GameStorage — sua biblioteca de jogos pessoal" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>GameStorage 🎮</title>

  <!-- Favicon inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Preconnect Google Fonts (já importado no CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

  <!-- SPA mount point — todo o HTML é injetado aqui pelo JS -->
  <div id="app">
    <div class="screen-center">
      <div class="spinner" aria-label="Carregando..."></div>
    </div>
  </div>

  <!-- Entry point (ES modules) -->
  <script type="module" src="js/main.js"></script>
  <body>

  <div class="bug-report">
 
    <div class="bug-report__balloon">
      <p class="bug-report__title">Reportar Bug</p>
      <p class="bug-report__text">
        Encontrou um erro?<br>
        Clique aqui para<br>
        nos avisar!
      </p>
    </div>
 
    <button class="bug-report__button" aria-label="Reportar Bug">
      <i class="bug-report__icon fa-solid fa-bug"></i>
    </button>
 
  </div>

</body>
</html>
