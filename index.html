<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GameStorage — sua biblioteca de jogos pessoal" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>GameStorage 🎮</title>

  <!-- Favicon inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Preconnect Google Fonts (já importado no CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

  <!-- SPA mount point — todo o HTML é injetado aqui pelo JS -->
  <div id="app">
    <div class="screen-center">
      <div class="spinner" aria-label="Carregando..."></div>
    </div>
  </div>

  <!-- Entry point (ES modules) -->
  <script type="module" src="js/main.js"></script>
  <body>

  <!-- Botão - report -->
  <div class="bug-report">

    <div class="bug-report__balloon">
      <p class="bug-report__title">Reportar Bug</p>
      <p class="bug-report__text">
        Encontrou um erro?<br>
        Clique aqui para<br>
        nos avisar!
      </p>
    </div>

    <button class="bug-report__button" aria-label="Reportar Bug">
      <span class="bug-report__pulse"></span>
      <svg class="bug-report__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
        <path d="M224 160C224 107 267 64 320 64C373 64 416 107 416 160L416 163.6C416 179.3 403.3 192 387.6 192L252.5 192C236.8 192 224.1 179.3 224.1 163.6L224.1 160zM569.6 172.8C580.2 186.9 577.3 207 563.2 217.6L465.4 290.9C470.7 299.8 474.7 309.6 477.2 320L576 320C593.7 320 608 334.3 608 352C608 369.7 593.7 384 576 384L480 384L480 416C480 418.6 479.9 421.3 479.8 423.9L563.2 486.4C577.3 497 580.2 517.1 569.6 531.2C559 545.3 538.9 548.2 524.8 537.6L461.7 490.3C438.5 534.5 395.2 566.5 344 574.2L344 344C344 330.7 333.3 320 320 320C306.7 320 296 330.7 296 344L296 574.2C244.8 566.5 201.5 534.5 178.3 490.3L115.2 537.6C101.1 548.2 81 545.3 70.4 531.2C59.8 517.1 62.7 497 76.8 486.4L160.2 423.9C160.1 421.3 160 418.7 160 416L160 384L64 384C46.3 384 32 369.7 32 352C32 334.3 46.3 320 64 320L162.8 320C165.3 309.6 169.3 299.8 174.6 290.9L76.8 217.6C62.7 207 59.8 186.9 70.4 172.8C81 158.7 101.1 155.8 115.2 166.4L224 248C236.3 242.9 249.8 240 264 240L376 240C390.2 240 403.7 242.8 416 248L524.8 166.4C538.9 155.8 559 158.7 569.6 172.8z"/>
      </svg>
    </button>
  </div>

  <!-- Modal -->
<div id="bug-report-modal" class="brm-overlay hidden">
  <div class="brm-box">
 
    <div class="brm-header">
      <span class="brm-title">Reportar Bug</span>
      <button class="brm-close" aria-label="Fechar">&times;</button>
    </div>
 
    <div class="brm-body">
      <div class="brm-field">
        <label class="brm-label">Data</label>
        <input class="brm-input" id="brm-data" type="text" disabled />
      </div>
      <div class="brm-field">
        <label class="brm-label">Navegador</label>
        <input class="brm-input" id="brm-navegador" type="text" disabled />
      </div>
      <div class="brm-field">
        <label class="brm-label">Resolução</label>
        <input class="brm-input" id="brm-resolucao" type="text" disabled />
      </div>
      <div class="brm-field">
        <label class="brm-label">Descrição <span class="brm-required">*</span></label>
        <textarea class="brm-input brm-textarea" id="brm-descricao" placeholder="Descreva o bug que encontrou..."></textarea>
        <span class="brm-error hidden" id="brm-erro">Por favor, descreva o bug.</span>
      </div>
    </div>
 
    <div class="brm-footer">
      <button class="brm-btn-cancel">Cancelar</button>
      <button class="brm-btn-send">Enviar Report</button>
    </div>
 
  </div>
</div>
    

</body>
</html>
